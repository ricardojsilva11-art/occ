<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OC Diário</title>
<meta name="theme-color" content="#0b2a4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="OC Diário">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calm operational tool, EFB-like, quick to scan on a phone or at the OCC desk
   IDEA: an ops logbook — the roster calendar is the cover, each day opens its report and checklists
   PICTURE: the month calendar with coloured shift chips, large, first thing on screen
   COLOUR and TYPE: light slate ground, white cards, navy ink; shift colours amber/sky/indigo/slate/teal; IBM Plex Sans + Plex Mono for times
   LAYOUT: top bar; calendar left, day panel right (stacks on phone: calendar, then day) */
:root{color-scheme:light dark;
--bg:light-dark(#eaeef3,#0c1117);--card:light-dark(#fff,#151c25);--card2:light-dark(#f5f7fa,#1b2430);--ink:light-dark(#0d1b2a,#e6edf5);--mute:light-dark(#5b6b7c,#8fa0b3);
--line:light-dark(#dde3ea,#263241);--nav:light-dark(#0b2a4a,#0b2a4a);--acc:light-dark(#0b5cad,#4aa3ff);--sh:0 1px 2px rgb(13 27 42/.06),0 6px 18px rgb(13 27 42/.07);
--M:#f59e0b;--T:#0ea5e9;--N:#5b4ee6;--F:#94a3b8;--V:#14b8a6;--ok:light-dark(#0b5cad,#4aa3ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.top{background:var(--nav);color:#fff;padding:12px max(4vw,14px);display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:10}
.top h1{margin:0;font-size:20px;font-weight:700;flex:1;line-height:1.1}
.top h1 small{display:block;font-weight:400;font-size:13px;opacity:.75}
.clock{font:600 22px "IBM Plex Mono";white-space:nowrap}.clock small{font:500 11px "IBM Plex Sans";opacity:.7;margin-inline-start:3px}
.sync{font-size:12px;opacity:.8;white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f59e0b;margin-inline-end:5px}
.sync.on i{background:#34d399}
.wrap{max-width:1240px;margin:auto;padding:18px max(4vw,14px) 48px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:920px){.wrap{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);border:1px solid var(--line)}
/* calendar */
.cal{padding:16px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.ch h2{margin:0;flex:1;font-size:clamp(20px,5vw,26px);line-height:1.1}
.ib{width:44px;height:44px;border-radius:12px;background:var(--card2);font-size:20px;display:grid;place-items:center}
.pill{height:44px;padding:0 14px;border-radius:12px;background:var(--card2);font-weight:600;font-size:15px}
.wd{display:none}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.day .n{font-size:30px;font-weight:700;line-height:1.05;letter-spacing:-.02em}
.day .mo{margin-inline-start:4px;text-transform:capitalize;color:var(--acc)}
.day .sh{width:100%;height:58px;border-radius:12px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 4px 10px color-mix(in srgb,var(--c) 30%,transparent)}
.day .sh b{font:600 12px/1 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.02em}
.day .sh.none{background:transparent;border:2px dashed var(--line);color:var(--mute);box-shadow:none;font-size:18px}
.day.past{opacity:.5}
.day.today{border-color:var(--ink)}
.day.today .wk{color:var(--ink);font-weight:700}
.day.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.day .wk{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase}
.day.we{background:color-mix(in srgb,var(--acc) 7%,var(--card2))}
.day.we .wk{color:var(--acc)}
.wd span{font-size:12px;font-weight:600;color:var(--mute);text-align:center;padding:4px 0}
.day{position:relative;flex:0 0 96px;min-height:142px;padding:10px 8px!important;scroll-snap-align:start;gap:4px;border-radius:12px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px;font-weight:600;font-size:15px;border:2px solid transparent;transition:transform .12s}
.day:hover{transform:translateY(-1px)}
.day.out{opacity:.35}
.day.today .n{color:var(--acc)}
.day.sel{border-color:var(--acc)}
.chip{min-width:28px;height:22px;padding:0 6px;border-radius:7px;font:600 12px "IBM Plex Mono";display:grid;place-items:center;color:#fff;background:var(--c)}
.chip.empty{background:transparent}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.edt{width:100%;display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 14px;min-height:44px;border-radius:12px;background:var(--card2);color:var(--mute);font-weight:600;font-size:14px}
.edt .chev{transition:transform .15s}.edt.on .chev{transform:rotate(90deg)}
#edtBox .legend{margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.lg{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px 0 6px;border-radius:12px;background:var(--card2);font-size:14px;font-weight:500;border:2px solid transparent}
.lg.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.lg b{font:600 13px "IBM Plex Mono"}
.paint{margin-top:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--acc) 10%,var(--card));font-size:14px;display:none}
.paint.on{display:block}
.stats{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 16px}
.stats b{color:var(--ink)}
/* day panel */
.dp{overflow:hidden}
.dh{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.dh h2{margin:0 0 12px;font-size:24px;line-height:1.1}
.dh h2 small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.sb{height:44px;min-width:52px;padding:0 12px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px;border:2px solid transparent;display:flex;align-items:center;gap:6px}
.sb i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.sb.on{background:var(--c);color:#fff}.sb.on i{background:#fff}
.hrs{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr);gap:8px 10px;margin-top:12px;align-items:center;font-size:14px;color:var(--mute);max-width:460px}
.hrs input{width:100%;min-width:0;padding:8px 6px;text-align:center}
.hrs b{min-width:56px}
input,textarea{font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;width:100%;min-height:44px}
textarea{resize:vertical;min-height:72px;line-height:1.45}
.tabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.tab{height:44px;padding:0 16px;font-weight:600;color:var(--mute);border-bottom:3px solid transparent;font-size:15px}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
.tab span{font:500 12px "IBM Plex Mono";margin-inline-start:6px;padding:2px 6px;border-radius:6px;background:var(--card2)}
.pane{padding:16px 18px 20px}
.kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:14px}
.kpi label{background:var(--card2);border-radius:12px;padding:8px 10px;font-size:12px;color:var(--mute);font-weight:500;display:block}
.kpi input{border:0;background:transparent;padding:0;min-height:34px;font:600 22px "IBM Plex Mono";color:var(--ink)}
@media(max-width:600px){.kpi{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rsec{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.rsec h3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0;padding:6px 8px 6px 14px;min-height:48px;background:#0f1b29;color:#fff;font-size:14px;font-weight:700;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px}
.cp{height:36px;padding:0 14px;border-radius:9px;background:rgb(255 255 255/.14);color:#fff;font-weight:600;font-size:13px;text-decoration:none;letter-spacing:0}
.attb{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 14px;background:var(--card)}
.atth{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}.atth span{font-size:13px;color:var(--mute)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.atc{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border-radius:12px;background:var(--card2);border:2px solid transparent;font-weight:600;font-size:14px}
.atc i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;background:color-mix(in srgb,var(--k) 18%,var(--card));color:var(--k);font-weight:700}
.atc small{font:500 12px "IBM Plex Mono",monospace;color:var(--mute)}
.atc.on{border-color:var(--k);background:color-mix(in srgb,var(--k) 12%,var(--card))}.atc.on i{background:var(--k);color:#fff}
.tatt{position:absolute;top:12px;right:12px;font-size:18px}
.cpb2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:4px 0 8px}.cpb2 .btn{height:52px;font-size:15px}
@media(max-width:600px){.cpb2{grid-template-columns:minmax(0,1fr)}}
.cp:hover{background:rgb(255 255 255/.24)}
.cpbox{width:100%;min-height:220px;font:14px/1.5 "IBM Plex Mono",monospace;margin:8px 0 12px}
.rtool{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 12px;font-size:13px;color:var(--mute)}.rtool .pill{height:36px;font-size:13px;padding:0 12px}
.rsec h3{cursor:pointer;user-select:none}
.rsec h3{text-decoration:none}
.rsec h3 .rtt{flex:1;text-decoration:underline;text-underline-offset:3px}
.rch{display:inline-block;transition:transform .15s;transform:rotate(90deg);margin-inline-end:8px;opacity:.8}
.rsec.col .rsec-h .rch,.rsec.col h3 .rch{transform:rotate(0)}
.rcnt{font:500 12px "IBM Plex Mono",monospace;opacity:.75;text-decoration:none;margin-inline-end:6px}
.rlab{display:flex;align-items:center;text-align:left;font-weight:700;font-size:14px;padding:11px 0 0;color:var(--ink)}
.rf.fcol .rlab .rch{transform:rotate(0)}
.rprev{text-align:left;min-height:40px;padding:8px 12px;border-radius:12px;background:var(--card2);border:1px dashed var(--line);font-size:14px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rprev.nil{color:var(--mute)}
.rf{display:grid;grid-template-columns:170px minmax(0,1fr);align-items:start;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
.rf:first-of-type{border-top:0}
.rf label{font-weight:700;font-size:14px;padding-top:11px}
@media(max-width:600px){.rlab{padding-top:2px}}
.rf textarea{min-height:44px;resize:none;overflow:hidden}
@media(max-width:600px){.rf{grid-template-columns:minmax(0,1fr);gap:4px}.rf label{padding-top:2px}}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.btn{height:44px;padding:0 16px;border-radius:12px;background:var(--acc);color:#fff;font-weight:600}
.btn.sec{background:var(--card2);color:var(--ink)}
.saved{font-size:13px;color:var(--mute)}
/* checklists */
.grp{font-size:13px;font-weight:700;color:var(--mute);margin:6px 0 10px;letter-spacing:.02em}
.tls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
@media(max-width:600px){.tls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tl{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:10px;min-height:118px;padding:14px;border-radius:16px;color:#fff;text-align:left;background:linear-gradient(150deg,color-mix(in srgb,var(--k) 88%,#fff),color-mix(in srgb,var(--k) 85%,#000));box-shadow:0 6px 16px color-mix(in srgb,var(--k) 30%,transparent);transition:transform .12s}
.tl:hover{transform:translateY(-2px)}
.tic{width:40px;height:40px;border-radius:12px;background:rgb(255 255 255/.2);display:grid;place-items:center}
.tnm{font-weight:700;font-size:16px;line-height:1.2;flex:1}
.tpr{display:flex;align-items:center;gap:8px;width:100%;font:600 13px "IBM Plex Mono"}
.tbar{flex:1;height:6px;border-radius:3px;background:rgb(255 255 255/.3);overflow:hidden}.tbar i{display:block;height:100%;background:#fff}
.tl.full::after{content:"✓";position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--k);display:grid;place-items:center;font-weight:700}
.cd{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.cdh{display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:14px;background:linear-gradient(150deg,color-mix(in srgb,var(--k) 88%,#fff),color-mix(in srgb,var(--k) 85%,#000));color:#fff}
.cbk{width:44px;height:44px;border-radius:12px;background:rgb(255 255 255/.18);color:#fff;display:grid;place-items:center;flex:none}
.cic{width:44px;height:44px;border-radius:12px;background:rgb(255 255 255/.18);display:grid;place-items:center;flex:none}
.cdt{flex:1;display:flex;flex-direction:column;line-height:1.2}.cdt b{font-size:20px}.cdt span{font-size:14px;opacity:.9;margin-top:2px}
.cact{display:flex;gap:8px;margin-left:auto}
@media(max-width:600px){.cact{width:100%;margin-left:0}.cact .crs{flex:1}.cic{display:none}}
.crs{height:40px;padding:0 14px;border-radius:10px;background:rgb(255 255 255/.18);color:#fff;font-weight:600;flex:none}
.cpg{height:6px;background:color-mix(in srgb,var(--k) 18%,var(--card2))}.cpg i{display:block;height:100%;background:var(--k);transition:width .25s}
.cit{list-style:none;margin:0;padding:10px}
.ci{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;user-select:none;min-height:56px;margin-bottom:6px;background:var(--card2);border:2px solid transparent}
.ci:hover{border-color:color-mix(in srgb,var(--k) 40%,transparent)}
.cn{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 14px "IBM Plex Mono";color:var(--k);background:color-mix(in srgb,var(--k) 15%,var(--card));border:2px solid var(--k)}
.ci .t{flex:1;font-weight:500}
.ci.on{background:color-mix(in srgb,var(--k) 10%,var(--card))}
.ci.on .cn{background:var(--k);color:#fff}
.ci.on .t{color:var(--mute);text-decoration:line-through}
.x{color:var(--mute);width:36px;height:36px;border-radius:8px;flex:none}
.ci.hs{margin-bottom:2px}
.subw{list-style:none;margin:0 0 6px}
.sub{list-style:none;margin:0;padding:0 0 0 44px}
.cs{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;min-height:42px;font-size:15px;user-select:none}
.cs:hover{background:var(--card2)}
.sbx{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid color-mix(in srgb,var(--k) 70%,var(--mute));display:grid;place-items:center}
.cs.on .sbx{background:var(--k);border-color:var(--k)}
.cs.on .sbx::after{content:"";width:9px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
.cs.on .t{color:var(--mute);text-decoration:line-through}
.ce,.ces{display:flex;align-items:center;gap:10px;padding:6px 8px;margin-bottom:4px;list-style:none}
.ces{padding-left:52px}
.ein{flex:1;min-height:42px;font-size:15px}
.adds{display:flex;gap:8px;padding:0 8px 10px 52px}
.adds input{flex:1;min-height:40px;font-size:15px}
.rdoq{margin:4px 10px 10px;padding:12px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--k) 50%,var(--line));display:grid;gap:8px}
.rdoq b{font-size:14px}
.rdoq div{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px}
@media(max-width:600px){.rdoq div{grid-template-columns:1fr 1fr}.rdoq div input:last-child{grid-column:1/-1}}
.addi{display:flex;gap:8px;padding:0 10px 12px}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px}
.tlw{position:relative;display:grid}
.tdel{position:absolute;top:-8px;right:-8px;width:34px;height:34px;border-radius:50%;background:#fff;color:#dc2626;font-weight:700;box-shadow:0 2px 8px rgb(0 0 0/.25);border:2px solid #dc2626;z-index:2}
.tadd{background:var(--card2)!important;color:var(--acc)!important;border:2px dashed color-mix(in srgb,var(--acc) 50%,var(--line));box-shadow:none!important;justify-content:center;align-items:center;text-align:center}
.crs.on{background:#fff;color:var(--k)}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:12px;border:3px solid transparent}
.sw.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px #fff}
.icb{width:44px;height:44px;border-radius:12px;background:var(--card2);display:grid;place-items:center;color:var(--mute);border:2px solid transparent}
.icb.on{background:var(--k);color:#fff}
.empty{color:var(--mute);font-size:14px}
.note{font-size:13px;color:var(--mute);margin:12px 0 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.on{opacity:1}
.imp{width:100%;margin:2px 0 12px;height:48px;border-radius:12px;border:2px dashed color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc);font-weight:600;font-size:15px;background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.imp:hover{background:color-mix(in srgb,var(--acc) 12%,var(--card))}
.mod{position:fixed;inset:0;background:rgb(8 15 25/.55);display:none;place-items:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));z-index:40;overscroll-behavior:contain}
.mod.on{display:grid}
.mbox{position:relative;width:min(560px,100%);max-height:calc(100vh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgb(0 0 0/.3)}
.mtop{position:sticky;top:-20px;margin:-20px -20px 10px;padding:16px 20px 10px;background:var(--card);display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:2;border-bottom:1px solid var(--line)}
.mtop h3{margin:0}
.mclose{width:40px;height:40px;border-radius:12px;background:var(--card2);font-size:18px;color:var(--ink)}
.mbox h3{margin:0 0 6px;font-size:22px}
.mbox p{margin:0 0 14px;color:var(--mute);font-size:14px}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;cursor:pointer;margin-bottom:12px;font-weight:600}
.drop.over,.drop:hover{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 6%,var(--card))}
.drop small{display:block;font-weight:400;color:var(--mute);margin-top:4px}
.drop input{display:none}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);margin:20px auto;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.prev{max-height:44vh;overflow:auto;border:1px solid var(--line);border-radius:12px;margin:10px 0}
.pr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px}
.pr:last-child{border-bottom:0}
.pr .d{flex:1}
.pr.old{opacity:.55}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:8px 0}
.chk input{width:20px;height:20px;min-height:0}
.err{color:#d43c2f;font-size:14px;margin:8px 0}
.gear{width:40px;height:40px;border-radius:10px;color:#fff;display:grid;place-items:center;background:rgb(255 255 255/.1)}
.top{padding-top:calc(env(safe-area-inset-top,0px) + 14px)}
.top h1,.top .clock,.top .gear,.top .sync{position:relative;z-index:1}
.login{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0b2a4a,#123f6b);display:none;place-items:center;padding:20px}
.login.on{display:grid}
.lbox{width:min(400px,100%);background:var(--card);border-radius:20px;padding:26px;display:grid;gap:10px;box-shadow:0 20px 60px rgb(0 0 0/.35)}
.lbox h2{margin:6px 0 0;font-size:26px}.lbox p{margin:0;color:var(--mute);font-size:14px}
.lbox input{font-size:18px;letter-spacing:.04em;text-align:center}
.sel{font-size:16px;border:1px solid var(--line);border-radius:12px;background:var(--card2);padding:10px 12px;width:100%;min-height:44px;color:var(--ink)}
.maps{display:grid;gap:10px;max-height:46vh;overflow:auto;margin-bottom:6px}
.mp{border:1px solid var(--line);border-radius:12px;padding:10px}
.mp.need{border-color:#f59e0b;background:color-mix(in srgb,#f59e0b 7%,var(--card))}
.mph{display:flex;align-items:center;gap:8px;margin-bottom:8px}.mph small{color:var(--mute)}
.mp .sb{height:38px;min-width:0;font-size:13px}
@media(max-width:600px){
.top{gap:10px;padding-left:16px;padding-right:12px;padding-bottom:10px}
.top h1{font-size:18px}.top h1 small{font-size:13px;opacity:.85}
.sync{font-size:0;padding:6px}.sync i{width:10px;height:10px;margin:0}
.clock{font-size:19px}.clock small{font-size:10px}
.gear{width:38px;height:38px}
.wrap{padding:12px 10px 40px;gap:12px}
.cal{padding:12px}
.ch{flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ch h2{order:-1;flex:1 0 100%;font-size:22px;margin:0 2px 4px}
.ch .ib{flex:0 0 44px;height:42px}.ch .pill{flex:1;height:42px}
.imp{height:44px;font-size:14px;margin-bottom:10px}
.days{gap:6px}
.day{flex:0 0 calc((100% - 18px)/4);min-height:124px;padding:8px 4px!important}
.day .n{font-size:24px}.day .wk{font-size:11px}
.day .sh{height:52px;border-radius:10px}.day .sh b{font-size:11px}
.dh{padding:14px 14px 12px}.dh h2{font-size:21px}
.pane{padding:12px 12px 18px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* curfews */
.cw-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cw-seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.cw-seg button{height:38px;padding:0 12px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.cw-seg button.on{background:var(--cwc,#185FA5);color:#fff}
.cw-ban{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;font-weight:700;font-size:14px;margin-bottom:10px;color:#fff;background:var(--cwc)}
.cw-ban small{margin-inline-start:auto;font-weight:500;font-size:12px;opacity:.9}
.cw-ban u{cursor:pointer}
.cwqh{margin:6px 0 6px!important;font-weight:700;color:var(--ink)!important;font-size:14px}
.cwq{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.cw-al{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cw-ac{font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;color:#fff}
.cw-sec{padding:7px 12px;font-size:12px;font-weight:700;color:var(--mute);background:var(--card2);border-radius:10px;margin:8px 0 4px;letter-spacing:.03em}
.cw-row{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.cw-bar{align-self:stretch;min-height:56px;border-radius:3px}
.cw-pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;color:#fff;white-space:nowrap;display:inline-block}
.cw-sm{font-size:12px;color:var(--mute)}
.cw-tags{font-size:12px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cw-tag{padding:3px 8px;border-radius:8px;font-weight:600}
.cw-ib{background:light-dark(#FBEAF0,#72243E);color:light-dark(#72243E,#FBEAF0)}
.cw-xt{background:light-dark(#EEEDFE,#3C3489);color:light-dark(#3C3489,#EEEDFE)}
.cw-air .cw-sm,.cw-air .cw-nm{color:var(--mute)}
.cw-nm{font-size:16px;font-weight:700}
.cw-ed{background:var(--card2);padding:12px;border-radius:12px;margin:6px 0 10px}
.cw-eg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cw-eg label{font-size:12px;color:var(--mute);font-weight:600}
.cw-eg input{margin-top:3px;font-family:"IBM Plex Mono",monospace;text-align:center}
.cw-need{border:2px solid #5F5E5A!important}
.cw-atd{border:2px solid #0F6E56!important}
.cw-x{grid-column:1/-1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--card)}
.cw-x.on{border:2px solid #534AB7;background:light-dark(#EEEDFE,#26215C)}
.cw-x input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:#534AB7;margin:0;flex:none}
.cw-x .cw-xl{flex:1;font-size:14px;font-weight:600;color:var(--ink)}
.cw-x input.cw-xt2{width:100px;margin:0}
.cw-err{grid-column:1/-1;font-size:13px;color:#A32D2D;font-weight:600}
.cw-tb{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.cw-tg{display:grid;grid-template-columns:84px minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center;font-size:13px;margin-top:6px}
.cw-tg input{text-align:center;font-family:"IBM Plex Mono",monospace;min-height:38px;padding:6px}
.cw-tg input.act{border:2px solid var(--cwc)}
.cw-ch{border-color:#BA7517!important;background:light-dark(#FAEEDA,#633806)!important}
.cw-fg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.cw-fg label{font-size:11px;color:var(--mute);font-weight:600}
.cw-fg input{text-align:center;font-family:"IBM Plex Mono",monospace;min-height:38px;padding:6px;margin-top:2px}
@media(max-width:600px){.cw-fg{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cw-note{font-size:12px;color:var(--mute);margin:8px 0}
.cw-warn{color:#BA7517}
</style>

</header>
<div class="wrap">
  <section class="card cal">
    <div class="ch">
      <button class="ib" id="prev" aria-label="Semana anterior">‹</button>

      <label class="ib" title="Ir para uma data" style="position:relative;cursor:pointer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><input type="date" id="goto" aria-label="Ir para uma data" style="position:absolute;inset:0;opacity:0;cursor:pointer;min-height:0;padding:0;border:0"></label>

</div>

<div class="login" id="login"><form class="lbox" id="lf" autocomplete="off">
  <img src="icon-192.png" alt="" width="64" height="64" style="border-radius:16px">

</form></div>
<div class="mod" id="mod" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mbox" id="mbox"></div></div>
<script>
{
const ST=[{k:"M",n:"Manhã",h:["06:30","15:00"]},{k:"T",n:"Tarde",h:["14:45","23:15"]},{k:"N",n:"Noite",h:["23:00","07:00"]},{k:"F",n:"Folga"},{k:"V",n:"Férias"}];
const SK=Object.fromEntries(ST.map(s=>[s.k,s]));
const hoursOf=k=>SK[k]?.h?((cfg.hours&&cfg.hours[k])||SK[k].h).slice():null;
const RDO=[{h:"SHIFT MANAGER",f:[["wx","WX/HLD"],["rgzfw","RGZFW"],["div","Diverted Flights"],["fuel","Fueled Aircraft"],["sys","System failures"],["smoth","Others"]]},{h:"ATC MANAGEMENT",f:[["fl","ATC FL Capping"],["atfcm","ATFCM Regulations"],["oth","Others"]]}];
const TPL=[
{id:"ini",g:"Turno",t:"Início de turno",c:"#f59e0b",ic:"sun",i:["Briefing com DM cessante","Log OCC lido","Pendentes identificados","Frota / AOG / MEL revistos","Spares e reservas de tripulação","Meteo e NOTAM revistos","ATFM / slots verificados","Curfews em risco identificados"]},
{id:"rot",g:"Turno",t:"Rotina horária",c:"#0ea5e9",ic:"clock",i:["Atrasos / OTP","CTOT vs EOBT","Flight watch","Margens FTL","Log OCC atualizado"]},
{id:"fim",g:"Turno",t:"Fim de turno",c:"#7c3aed",ic:"moon",i:["Planeamento D+1 confirmado","Manutenção noturna confirmada","RDO preenchido","Reports submetidos","Briefing ao DM entrante"]},
{id:"div",g:"IROPS",t:"Diverted flight",c:"#e11d48",ic:"divert",rdo:1,i:["Alternante, motivo e ETA confirmados (ACARS / SATCOM)","Combustível remanescente e necessidades","Handling, escala e aeroporto alternante informados","Estacionamento e serviços em terra (fuel, catering, PRM)","FTL da tripulação — pode continuar?","Curfew / horário do alternante e do destino","Decisão: reabastecer e prosseguir / night stop / cancelar","Novo plano de voo e CTOT de continuação","Assistência a passageiros (EU261, hotel, transporte)","Hotel e transporte da tripulação (se night stop)","MCC informado (inspeção técnica se necessário)","Rotações seguintes replaneadas","Registado no RDO (Diverted Flights)"]},
{id:"aog",g:"IROPS",t:"AOG",c:"#ea580c",ic:"wrench",i:["MCC: diagnóstico e ETR","MEL / CDL verificada","Voos afetados identificados","Plano de recuperação decidido","PAX e tripulação tratados","Stakeholders informados"]},
{id:"cur",g:"IROPS",t:"Risco de curfew",c:"#4f46e5",ic:"moon",i:["Limite UTC confirmado","ETA + taxi vs limite","Dispensa do aeroporto verificada","Alternativa / night stop decidido","Hotel e manutenção coordenados"]},
{id:"dly",g:"IROPS",t:"Atraso significativo",c:"#ca8a04",ic:"clock",i:["Causa e ETD revisto","Impacto nas rotações","FTL e curfew verificados","Troca de avião / tripulação avaliada","Novo CTOT","Stakeholders informados"]},
{id:"wx",g:"IROPS",t:"Meteo / ATC",c:"#0891b2",ic:"cloud",i:["Fenómeno / regulação e janela","Voos afetados listados","Fuel e alternantes com despacho","De-icing / melhoria de slot","Medidas proativas decididas"]},
{id:"cnx",g:"IROPS",t:"Cancelamento",c:"#db2777",ic:"x",i:["Autorização obtida","Reproteção de PAX iniciada","Avião, tripulação e slot replaneados","Aeroportos e handling informados"]},
{id:"med",g:"IROPS",t:"Emergência médica",c:"#16a34a",ic:"plus",i:["Informação da tripulação","Apoio médico em terra","Decisão do comandante","Serviços médicos no destino"]},
{id:"erp",g:"IROPS",t:"Emergência / ERP",c:"#dc2626",ic:"alert",i:["Info inicial registada com hora","ERP ativado","Management / equipa de crise","Autoridades conforme ERP","Manifesto e documentos preservados","Comunicação externa só via porta-voz"]}
];
const IC={sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',divert:'<path d="M5 20V10a4 4 0 0 1 4-4h9"/><path d="M14 2l4 4-4 4"/><circle cx="5" cy="20" r="1.5"/>',wrench:'<path d="M14.7 6.3a4 4 0 0 0 5 5L12 19a2.1 2.1 0 0 1-3-3l7.7-7.7z"/><path d="M14.7 6.3 17 4"/>',cloud:'<path d="M7 18h10a4 4 0 0 0 .5-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9z"/>',x:'<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>',plus:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>',alert:'<path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/>',back:'<path d="M15 5l-7 7 7 7"/>'};
const svg=k=>`<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
let chk=null,editing=false;
const SW=["#e11d48","#ea580c","#f59e0b","#16a34a","#0891b2","#0ea5e9","#4f46e5","#7c3aed","#db2777","#475569"];
IC.list='<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>';
IC.plane='<path d="M10.5 21l1.5-6-7-2 1-2 7 .5L17 4a1.5 1.5 0 0 1 2.5 1.5L16 12l2 7-2 1-3.5-5-2 6z"/>';
IC.edit='<path d="M4 20h4L19 9l-4-4L4 16v4z"/>';
const ICK=["list","plane","divert","wrench","clock","sun","moon","cloud","alert","plus","x"];
const allT=()=>TPL.filter(t=>!(cfg.hidden||[]).includes(t.id)).concat(cfg.lists||[]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
const fromKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const clone=o=>JSON.parse(JSON.stringify(o));
let todayK=key(new Date());
let cfg={extra:{}},days={},sel=todayK,tab="rep",paint=null,open={ini:1,rot:1,fim:1};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const BACK=21;let winStart=addD(fromKey(todayK),-BACK);const WN=63;
let live=false;
const API_DEF="https://occ-api.ricardo-j-silva11.workers.dev";
let API=localStorage.getItem("occ-api")||API_DEF,KEY=localStorage.getItem("occ-key")||"";
const fnv=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
let LK="occ-x",dirty=new Set(),since=0,syncing=false,syncAgain=false,syncT=null,lastSync=0;
const loadLocal=()=>{try{const l=JSON.parse(localStorage.getItem(LK)||"null");cfg=(l&&l.cfg)||{extra:{}};cfg.extra=cfg.extra||{};days=(l&&l.days)||{};dirty=new Set((l&&l.dirty)||[]);since=(l&&l.since)||0}catch(e){}};
const local=()=>{try{localStorage.setItem(LK,JSON.stringify({cfg,days,dirty:[...dirty],since}))}catch(e){}};
const blank=k=>({date:k,shift:"",start:"",end:"",kpi:{},rep:{},checks:{}});
const getDay=k=>days[k]||blank(k);
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1800)}
function persist(id,data,wait){if(id==="cfg")cfg._u=Date.now();dirty.add(id);local();
  setSync(false,navigator.onLine?"A gravar…":"Offline · guardado no dispositivo");clearTimeout(syncT);syncT=setTimeout(sync,Math.max(wait||0,1200))}
const saveDay=(k,wait)=>persist("d-"+k,days[k],wait);
const saveCfg=()=>persist("cfg",cfg,0);
const docOf=id=>id==="cfg"?cfg:days[id.slice(2)];
const upd=v=>v?(typeof v._u==="number"?v._u:(Date.parse(v.updated)||0)):0;
async function sync(){if(!KEY)return;if(syncing){syncAgain=true;return}
  if(!navigator.onLine){setSync(false,"Offline · guardado no dispositivo");return}
  syncing=true;syncAgain=false;
  const sent=[...dirty].map(id=>{const d=docOf(id);return d?{id,data:d,updated:upd(d)||Date.now()}:null}).filter(Boolean);
  try{const r=await fetch(API.replace(/\/$/,"")+"/sync",{method:"POST",headers:{"Content-Type":"application/json","X-Key":KEY},body:JSON.stringify({since:Math.max(0,since-5000),docs:sent})});
    if(r.status===401){setSync(false,"Código inválido");syncing=false;return}
    if(!r.ok)throw new Error("http "+r.status);
    const j=await r.json();
    sent.forEach(s=>{if(upd(docOf(s.id))===s.updated)dirty.delete(s.id)});
    let ch=false;
    (j.docs||[]).forEach(x=>{if(dirty.has(x.id)||!x.data)return;const cur=docOf(x.id);if(cur&&upd(cur)>=x.updated)return;
      if(x.id==="cfg"){cfg=x.data;cfg.extra=cfg.extra||{};ch=true}else if(x.id.startsWith("d-")){days[x.id.slice(2)]=x.data;ch=true}});
    since=j.now||since;lastSync=Date.now();if(ch)migrateHours();local();live=true;setSync(true,dirty.size?"A gravar…":"Sincronizado");
    if(ch){renderCal();const a=document.activeElement;if(!(a&&dp.contains(a)&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT")))renderDay()}}
  catch(e){live=false;setSync(false,"Sem rede · guardado no dispositivo")}
  syncing=false;if(syncAgain||(live&&dirty.size))setTimeout(sync,800)}
function setSync(on,t){const s=$("#sync");s.classList.toggle("on",on);s.innerHTML="<i></i>"+esc(t)}

async function mapaPdf(buf){await loadJs("vendor/pdf.min.js");const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="vendor/pdf.worker.min.js";

        cols=[];for(let i=i0,d=1;i<r.length&&datas[i]&&datas[i].d===d&&datas[i].m===datas[i0].m;i++,d++)cols.push({dia:d,ix:i});continue}
      {const i1=r.findIndex(c=>String(c??"").trim()==="1");if(i1>=0&&!cols){let n=0;while(i1+n<r.length&&String(r[i1+n]??"").trim()===String(n+1))n++;if(n>=28){cols=[];for(let d=1;d<=n;d++)cols.push({dia:d,ix:i1+d-1});continue}}}

$("#setBtn").onclick=settings;
mbox.addEventListener("click",async e=>{const id=e.target.id;

  if(id==="cyb"){const y=$("#cy").value;const ks=Object.keys(days).filter(k=>k.startsWith(y+"-")&&days[k].shift);

    ks.forEach(k=>edit(k,d=>{d.shift="";d.code="";d.start="";d.end=""}));render();closeM();toast(ks.length+" turnos de "+y+" apagados")}
  if(id==="sout"){if(dirty.size&&!e.target.dataset.sure){e.target.dataset.sure=1;e.target.textContent="Há dados por enviar — tocar outra vez para sair";return}

const lg=$("#login");

function genKey(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint32Array(12);crypto.getRandomValues(r);let s="OCC";for(let i=0;i<12;i++){if(i%4===0)s+="-";s+=A[r[i]%A.length]}return s}

  if(k.length<10){$("#lerr").textContent="O código tem de ter pelo menos 10 caracteres.";return}startWith(k)});
const APPV="33";
async function rdoPdf(d){try{await loadJs("vendor/jspdf.umd.min.js")}catch(_){toast("Não foi possível criar o PDF");return}
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:"mm",format:"a4"}),W=210,M=16,CW=W-2*M;let y=0;
  const dt=fromKey(d.date),s=SK[d.shift],dl=dt.toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  doc.setFillColor(11,42,74);doc.rect(0,0,W,30,"F");doc.setTextColor(255,255,255);
  doc.setFont("helvetica","bold");doc.setFontSize(20);doc.text("RDO"+(cfg.pname?" - "+String(cfg.pname).toUpperCase():""),M,14);
  doc.setFontSize(12);doc.text(dt.toLocaleDateString("pt-PT"),W-M,14,{align:"right"});
  doc.setFont("helvetica","normal");doc.setFontSize(10);doc.text(dl.charAt(0).toUpperCase()+dl.slice(1),M,22);
  if(s)doc.text(`${s.n}${d.code?" ("+d.code+")":""}${d.start?"  "+d.start+" - "+d.end:""}`,W-M,22,{align:"right"});
  y=40;doc.setTextColor(13,27,42);
  const page=h=>{if(y+h>282){doc.addPage();y=18}};
  RDO.forEach(g=>{page(18);doc.setFillColor(15,27,41);doc.roundedRect(M,y,CW,9,1.5,1.5,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text(g.h,M+4,y+6.2);y+=13;doc.setTextColor(13,27,42);
    g.f.forEach(([k,l])=>{const v=(d.rep?.[k]||"").trim()||"NIL";doc.setFontSize(10);doc.setFont("helvetica","normal");const lines=doc.splitTextToSize(v,CW-8);const bh=Math.max(12,lines.length*5+6);page(bh+9);
      doc.setFont("helvetica","bold");doc.setFontSize(10);doc.setTextColor(13,27,42);doc.text(l,M,y+4);y+=6;
      doc.setDrawColor(190,200,212);doc.setFillColor(247,249,251);doc.roundedRect(M,y,CW,bh,1.5,1.5,"FD");
      doc.setFont("helvetica","normal");doc.setTextColor(v==="NIL"?130:13,v==="NIL"?140:27,v==="NIL"?150:42);doc.text(lines,M+4,y+6);doc.setTextColor(13,27,42);y+=bh+5});y+=4});
  const used=attOf(d).map(id=>allT().find(t=>t.id===id)).filter(Boolean);
  if(used.length){page(18);doc.setFillColor(15,27,41);doc.roundedRect(M,y,CW,9,1.5,1.5,"F");doc.setTextColor(255,255,255);doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("CHECKLISTS",M+4,y+6.2);y+=14;
    used.forEach(t=>{const it=items(t),c=(d.checks||{})[t.id]||[],N=pts(t).length,n=pts(t).filter(i=>c.includes(i.id)).length;page(14);
      const hx=t.c.replace("#","");doc.setFillColor(parseInt(hx.slice(0,2),16),parseInt(hx.slice(2,4),16),parseInt(hx.slice(4,6),16));doc.rect(M,y-0.5,2.2,6,"F");
      doc.setTextColor(13,27,42);doc.setFont("helvetica","bold");doc.setFontSize(10.5);doc.text(t.t,M+5,y+4);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.setTextColor(100,110,120);doc.text(`${n}/${N}${n===N?"  -  concluída":""}`,W-M,y+4,{align:"right"});y+=8;
      it.forEach(i=>{const on=c.includes(i.id);doc.setFontSize(9.5);const lines=doc.splitTextToSize(i.t,CW-12);const h=lines.length*4.6+1.6;page(h);
        doc.setDrawColor(120,130,140);doc.setLineWidth(0.3);doc.rect(M+5,y,3.6,3.6);
        if(on){doc.setDrawColor(11,92,173);doc.setLineWidth(0.6);doc.line(M+5.7,y+1.9,M+6.6,y+2.9);doc.line(M+6.6,y+2.9,M+8.1,y+0.7);doc.setLineWidth(0.2)}
        doc.setTextColor(on?13:110,on?27:120,on?42:130);doc.setFont("helvetica","normal");doc.text(lines,M+11,y+3);y+=h;
        subsOf(t,i.id).forEach(x=>{const so=c.includes(x.id);doc.setFontSize(9);const sl=doc.splitTextToSize(x.t,CW-20);const sh=sl.length*4.3+1.4;page(sh);
          doc.setDrawColor(150,160,170);doc.setLineWidth(0.25);doc.rect(M+12,y+0.3,3,3);
          if(so){doc.setDrawColor(11,92,173);doc.setLineWidth(0.5);doc.line(M+12.6,y+1.9,M+13.4,y+2.7);doc.line(M+13.4,y+2.7,M+14.6,y+0.9);doc.setLineWidth(0.2)}
          doc.setTextColor(so?13:110,so?27:120,so?42:130);doc.text(sl,M+17,y+2.9);y+=sh})});
      y+=4})}
  doc.setFontSize(8);doc.setTextColor(120,130,140);doc.text("Gerado em "+new Date().toISOString().slice(0,16).replace("T"," ")+" UTC · OC Diário",M,290);
  const name=`RDO_${d.date}.pdf`,blob=doc.output("blob"),file=new File([blob],name,{type:"application/pdf"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})&&matchMedia("(pointer:coarse)").matches){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("PDF criado")}
let showEd=false;try{showEd=localStorage.getItem("occ-ed")==="1"}catch(_){}

function fixHours(){const def={M:["06:30","15:00"],T:["14:45","23:15"],N:["23:00","07:00"]},old=[["07:00","15:00"],["15:00","23:00"]];
  Object.keys(days).forEach(dk=>{const d=days[dk];if(!def[d.shift]||(d.code&&KNOWN[String(d.code).toUpperCase()]))return;const mine=hoursOf(d.shift);
    const wrong=ST.some(x=>x.h&&x.k!==d.shift&&(()=>{const h=hoursOf(x.k);return d.start===h[0]&&d.end===h[1]})())||old.some(h=>d.start===h[0]&&d.end===h[1]&&!(mine[0]===h[0]&&mine[1]===h[1]));
    if(wrong)edit(dk,x=>{x.start=mine[0];x.end=mine[1]})})}
function migrateHours(){fixHours();cwRev40();if(cfg.hmig)return;let n=0;Object.keys(days).forEach(dk=>{const d=days[dk];
    if(d.shift==="M"&&d.start==="07:00"&&d.end==="15:00"&&!/^M046$/i.test(d.code||"")){edit(dk,x=>{x.start="06:30";x.end="15:00"});n++}
    else if(d.shift==="T"&&d.start==="15:00"&&d.end==="23:00"){edit(dk,x=>{x.start="14:45";x.end="23:15"});n++}});cfg.hmig=1;saveCfg()}
function startWith(k){KEY=k;try{localStorage.setItem("occ-key",k)}catch(_){}LK="occ-"+fnv(k);loadLocal();migrateHours();lg.classList.remove("on");render();setSync(false,"A ligar…");sync()}
